[project]
name = "proj-jh"
version = "0.1.0"
description = ""
authors = [
    {name = "Luan Kaike",email = "luankaikemacksantos@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "mysql (>=0.0.3,<0.0.4)",
    "mysql-connector (>=2.2.9,<3.0.0)",
    "mysql-connector-python (>=26.10.0,<27.0.0)"
]

[tool.poetry]
packages = [
	{include = "proj_jh", from = "src"},
	{include = "api", from = "src"},
	{include = "db", from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
